# Short biography shown on the home page (plain text or simple HTML).
bio: >-
  I am an Assistant Professor in the Department of Mechanical Engineering at IIT Madras,
  where I lead the Distributed Intelligence &amp; Robotics (DIRo) Lab. My group develops
  control and learning methods for networks of robots, with a focus on contact-rich
  manipulation, cooperative handling of objects, and multi-robot coordination for
  autonomous warehouses. I received my Ph.D. in Mechanical Engineering from the University
  of Washington, Seattle, and worked at the Boeing Advanced Research Center and Mitsubishi
  Electric Research Laboratories before joining IIT Madras in 2023.
