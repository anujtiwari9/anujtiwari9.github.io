# Videos and photos for the "In the lab" page. Newest or most important first within each theme.
#
# HOW TO FILL IN A TEMPLATE ENTRY
#   YouTube:  put the part of the link after v= in  id:   (and keep type: youtube)
#   MP4 file: upload to assets/video/, set  type: video  and  src: "/assets/video/your-file.mp4"
#   Photo:    upload to assets/img/lab/, set  type: image  and  src: "/assets/img/lab/your-photo.jpg"
# Entries with an empty id/src show a "Video coming soon" tile, so you can leave them as they are.
#
# theme:    manipulation | coordination | warehouses | networks  (which section it appears under)
# featured: true  -> also shown on the home page (only once the video/photo is filled in)

